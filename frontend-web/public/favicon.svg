<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definición de Gradientes para las tonalidades de tu marca -->
  <defs>
    <linearGradient id="azulFondo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#001a33"/>
    </linearGradient>
    <linearGradient id="cieloGradiente" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#0077c8"/>
    </linearGradient>
    <linearGradient id="marGradiente" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8e8"/>
      <stop offset="100%" stop-color="#005580"/>
    </linearGradient>
  </defs>

  <!-- Estructura Externa: Pin de Localización Turística -->
  <path d="M256,16 C134.5,16 36,114.5 36,236 C36,332.5 164,480 256,496 C348,480 476,332.5 476,236 C476,114.5 377.5,16 256,16 Z" fill="url(#azulFondo)"/>
  <path d="M256,36 C145.5,36 56,125.5 56,236 C56,320 170,450 256,464 C342,450 456,320 456,236 C456,125.5 366.5,36 256,36 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Máscara Circular Interna para el Paisaje Turístico -->
  <g transform="translate(0, -10)">
    <mask id="corteCircular">
      <circle cx="256" cy="220" r="170" fill="#ffffff"/>
    </mask>
    
    <g mask="url(#corteCircular)">
      <!-- Cielo -->
      <circle cx="256" cy="220" r="170" fill="url(#cieloGradiente)"/>

      <!-- Sol Vibrante -->
      <circle cx="160" cy="120" r="32" fill="#ffd100"/>
      <circle cx="160" cy="120" r="40" fill="#ffd100" opacity="0.3"/>

      <!-- Montaña Cordillerana con Nieve -->
      <polygon points="160,280 320,130 460,280" fill="#004d80"/>
      <polygon points="288,160 320,130 352,160 336,180 320,170 304,180" fill="#ffffff"/>

      <!-- Arena / Playa Amarilla -->
      <path d="M120,270 C240,240 340,320 460,260 L460,400 L120,400 Z" fill="#ffd100"/>

      <!-- Mar Cyan Dinámico -->
      <path d="M100,300 C200,260 300,340 430,290 L430,400 L100,400 Z" fill="url(#marGradiente)"/>

      <!-- Palmeras de la Costa -->
      <path d="M380,290 Q370,250 350,220" stroke="#003366" stroke-width="6" fill="none"/>
      <path d="M350,220 Q320,210 310,230 M350,220 Q350,190 330,190 M350,220 Q380,210 390,230 M350,220 Q370,190 370,180" stroke="#006633" stroke-width="5" fill="none"/>

      <!-- Iglesia / Arquitectura Local -->
      <rect x="110" y="210" width="50" height="70" fill="#ffd100" rx="4"/>
      <polygon points="100,210 135,170 170,210" fill="#b33636"/>
      <rect x="125" y="240" width="20" height="40" fill="#002244" rx="2"/>
    </g>
    
    <!-- Borde Blanco del Círculo Paisajístico -->
    <circle cx="256" cy="220" r="170" fill="none" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Icono de Avión (Turismo / Viajes) -->
  <path d="M370,90 L395,95 L430,70 L420,95 L450,110 L420,115 L415,145 L395,120 L370,125 Z" fill="#ffffff"/>
  <path d="M340,110 Q390,95 410,105" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

  <!-- Icono de Cámara Fotográfica -->
  <g transform="translate(350, 240) scale(0.8)">
    <rect x="10" y="20" width="90" height="60" fill="#ffd100" rx="8" stroke="#002244" stroke-width="6"/>
    <path d="M40,20 L45,10 L65,10 L70,20 Z" fill="#003366" stroke="#002244" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="55" cy="50" r="22" fill="#003366" stroke="#ffffff" stroke-width="4"/>
    <circle cx="55" cy="50" r="12" fill="#0077c8"/>
    <circle cx="85" cy="35" r="5" fill="#ffffff"/>
  </g>
</svg>